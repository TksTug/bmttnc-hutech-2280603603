<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h1 class="display-4 font-weight-bold text-primary">Caesar Cipher Tool</h1>
            <p class="lead">Encrypt and decrypt messages using Caesar Cipher</p>
        </div>

        <div class="row">
            <!-- Encryption Card -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white font-weight-bold">
                        Encryption
                    </div>
                    <div class="card-body">
                        <form method="POST" action="/encrypt">
                            <div class="form-group">
                                <label for="inputPlainText">Plain text</label>
                                <input type="text" class="form-control" id="inputPlainText" name="inputPlainText" placeholder="Input Plain Text" required autofocus/>
                            </div>
                            <div class="form-group">
                                <label for="inputKeyPlain">Key</label>
                                <input type="number" class="form-control" id="inputKeyPlain" name="inputKeyPlain" placeholder="Input Key" required/>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Encrypt</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Decryption Card -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white font-weight-bold">
                        Decryption
                    </div>
                    <div class="card-body">
                        <form method="POST" action="/decrypt">
                            <div class="form-group">
                                <label for="inputCipherText">Cipher text</label>
                                <input type="text" class="form-control" id="inputCipherText" name="inputCipherText" placeholder="Input Cipher Text" required/>
                            </div>
                            <div class="form-group">
                                <label for="inputKeyCipher">Key</label>
                                <input type="number" class="form-control" id="inputKeyCipher" name="inputKeyCipher" placeholder="Input Key" required/>
                            </div>
                            <button type="submit" class="btn btn-success btn-block">Decrypt</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
